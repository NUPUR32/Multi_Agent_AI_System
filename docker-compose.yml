# =============================================================================
# NUPUR32® AI Operating System - Docker Compose
# Full stack deployment with all services
# =============================================================================

version: "3.9"

services:
  # ============== AI OS Core ==============
  nupur32-core:
    build:
      context: .
      target: production
    container_name: nupur32-core
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
      - "9090:9090"
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/app
      - POSTGRES_URL=postgresql://nupur32:nupur32@postgres:5432/nupur32
      - MONGODB_URL=mongodb://mongodb:27017/nupur32
      - REDIS_URL=redis://redis:6379
      - NEO4J_URL=bolt://neo4j:7687
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    env_file:
      - .env
    volumes:
      - nupur32_data:/app/data
      - nupur32_logs:/app/logs
      - nupur32_memory:/app/memory
      - nupur32_output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - nupur32_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============== Dashboard ==============
  nupur32-dashboard:
    build:
      context: .
      target: dashboard
    container_name: nupur32-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
    env_file:
      - .env
    depends_on:
      - nupur32-core
    networks:
      - nupur32_net

  # ============== API Server ==============
  nupur32-api:
    build:
      context: .
      target: api
    container_name: nupur32-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    env_file:
      - .env
    depends_on:
      - nupur32-core
    networks:
      - nupur32_net

  # ============== Databases ==============
  postgres:
    image: postgres:16-alpine
    container_name: nupur32-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nupur32
      POSTGRES_PASSWORD: nupur32
      POSTGRES_DB: nupur32
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nupur32_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nupur32"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: nupur32-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nupur32
      MONGO_INITDB_ROOT_PASSWORD: nupur32
      MONGO_INITDB_DATABASE: nupur32
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nupur32_net

  redis:
    image: redis:7-alpine
    container_name: nupur32-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nupur32_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: nupur32-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: nupur32/nupur32
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    networks:
      - nupur32_net

  elasticsearch:
    image: elasticsearch:8.11
    container_name: nupur32-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - nupur32_net

  # ============== Monitoring ==============
  prometheus:
    image: prom/prometheus:latest
    container_name: nupur32-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - nupur32_net

  grafana:
    image: grafana/grafana:latest
    container_name: nupur32-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=nupur32
      - GF_SECURITY_ADMIN_PASSWORD=nupur32
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - nupur32_net

  # ============== Message Queue ==============
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nupur32-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: nupur32
      RABBITMQ_DEFAULT_PASS: nupur32
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nupur32_net

networks:
  nupur32_net:
    driver: bridge
    name: nupur32_network

volumes:
  nupur32_data:
  nupur32_logs:
  nupur32_memory:
  nupur32_output:
  postgres_data:
  mongodb_data:
  redis_data:
  neo4j_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data: